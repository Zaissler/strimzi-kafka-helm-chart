{{- $deploymentMode := include "kafka-cluster.deploymentMode" . }}
{{- $clusterName := include "kafka-cluster.clusterName" . }}

{{- if or (eq $deploymentMode "dual-role") (eq $deploymentMode "single-node") }}
{{/*
  Dual-role или Single-node режим: один NodePool с обеими ролями
*/}}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: {{ .Values.nodepool.name }}
  namespace: {{ .Values.namespace }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
    {{- include "kafka-cluster.labels" . | nindent 4 }}
spec:
  roles:
  {{- range .Values.nodepool.roles }}
    - {{ . }}
  {{- end }}
  replicas: {{ .Values.nodepool.replicas }}
  storage:
  {{- if eq .Values.nodepool.storage.type "jbod" }}
    type: jbod
    volumes:
    {{- if .Values.nodepool.storage.jbodVolumes }}
    {{- range .Values.nodepool.storage.jbodVolumes }}
      - id: {{ .id }}
        type: {{ .type }}
        {{- if eq .type "persistent-claim" }}
        size: {{ .size }}
        deleteClaim: {{ .deleteClaim | default false }}
        {{- end }}
        kraftMetadata: {{ .kraftMetadata | default "shared" }}
    {{- end }}
    {{- else }}
      - id: 0
        type: persistent-claim
        size: {{ .Values.nodepool.storage.size }}
        deleteClaim: {{ .Values.nodepool.storage.deleteClaim | default false }}
        kraftMetadata: shared
    {{- end }}
  {{- else if eq .Values.nodepool.storage.type "persistent-claim" }}
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.nodepool.storage.size }}
        deleteClaim: {{ .Values.nodepool.storage.deleteClaim | default false }}
        kraftMetadata: shared
  {{- else if eq .Values.nodepool.storage.type "ephemeral" }}
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
  {{- end }}
---
{{- end }}

{{- if eq $deploymentMode "separated-roles" }}
{{/*
  Separated-roles режим: отдельные NodePool для controller и broker
*/}}

