{{- $deploymentMode := include "kafka-cluster.deploymentMode" . }}
{{- $clusterName := include "kafka-cluster.clusterName" . }}
{{- $replicationFactor := include "kafka-cluster.replicationFactor" . }}
{{- $minInsyncReplicas := include "kafka-cluster.minInsyncReplicas" . }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kafka-cluster.labels" . | nindent 4 }}
    deploymentMode: {{ $deploymentMode }}
spec:
  kafka:
    version: {{ .Values.kafka.version | quote }}
    {{- if .Values.kafka.metadataVersion }}
    metadataVersion: {{ .Values.kafka.metadataVersion | quote }}
    {{- end }}
    config:
      # Автоматически вычисляемые значения репликации
      offsets.topic.replication.factor: {{ $replicationFactor }}
      transaction.state.log.replication.factor: {{ $replicationFactor }}
      transaction.state.log.min.isr: {{ $minInsyncReplicas }}
      default.replication.factor: {{ $replicationFactor }}
      min.insync.replicas: {{ $minInsyncReplicas }}
      {{- if .Values.kafka.config }}
      # Пользовательские параметры
      {{- range $key, $value := .Values.kafka.config }}
      {{ $key }}: {{ $value }}
      {{- end }}
      {{- end }}
    listeners:
{{- if .Values.kafka.listeners.enableNodePort }}
      - name: externalnp
        port: {{ .Values.kafka.listeners.externalnp.port }}
        type: nodeport
        tls: {{ .Values.kafka.listeners.externalnp.tls }}
      - name: externaltls
        port: {{ .Values.kafka.listeners.externaltls.port }}
        type: nodeport
        tls: {{ .Values.kafka.listeners.externaltls.tls }}
{{- end }}
      - name: plain
        port: {{ .Values.kafka.listeners.plain.port }}
        type: internal
        tls: {{ .Values.kafka.listeners.plain.tls }}
      - name: tls
        port: {{ .Values.kafka.listeners.tls.port }}
        type: internal
        tls: {{ .Values.kafka.listeners.tls.tls }}
{{- if and .Values.entityOperator .Values.entityOperator.enabled }}
  entityOperator:
  {{- if .Values.entityOperator.topicOperator.enabled }}
    topicOperator: {}
  {{- end }}
  {{- if .Values.entityOperator.userOperator.enabled }}
    userOperator: {}
  {{- end }}
{{- end }}

{{- if .Values.ingress.enabled | default false }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.kafka.clusterName | default "kraft-cluster" }}-ingress
  namespace: {{ .Values.namespace | default "kafka" }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
  rules:
{{- range .Values.ingress.hosts }}
  - host: {{ .host }}
    http:
      paths:
{{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ $.Values.kafka.clusterName | default "kraft-cluster" }}-kafka-brokers
            port:
              number: {{ $.Values.kafka.listeners.plain.port | default 9092 }}
{{- end }}
{{- end }}

{{- if .Values.ingress.tls }}
  tls:
{{- range .Values.ingress.tls }}
  - hosts:
{{- range .hosts }}
    - {{ . }}
{{- end }}
    secretName: {{ .secretName }}
{{- end }}
{{- end }}
{{- end }}
