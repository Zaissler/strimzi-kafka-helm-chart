# Values для развертывания Kafka с включенным JMX мониторингом
# Используется для мониторинга метрик через Prometheus JMX Exporter

namespace: dev

deploymentMode: dual-role

# JMX мониторинг включен
jmx:
  enabled: true  # Включить JMX метрики для Prometheus

kafka:
  clusterName: kraft-cluster
  version: "4.0.0"
  metadataVersion: "4.0-IV0"
  
  replication:
    offsetsTopicReplicationFactor: 3
    transactionStateLogReplicationFactor: 3
    transactionStateLogMinIsr: 2
    defaultReplicationFactor: 3
    minInsyncReplicas: 2
  
  config:
    auto.create.topics.enable: true
  
  listeners:
    enableNodePort: true
    externalnp:
      port: 31090
      tls: false
    externaltls:
      port: 31091
      tls: true
    plain:
      port: 9092
      tls: false
    tls:
      port: 9093
      tls: true

nodepool:
  name: dual-role
  roles:
    - broker
    - controller
  replicas: 3
  storage:
    type: persistent-claim
    size: 1Gi
    deleteClaim: false

entityOperator:
  enabled: true
  topicOperator:
    enabled: true
  userOperator:
    enabled: true

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: kafka.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kafka-tls-secret
      hosts:
        - kafka.example.com
