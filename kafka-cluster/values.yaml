# Namespace для развертывания
namespace: dev

# Режим развертывания: "dual-role", "separated-roles", "single-node"
# dual-role: broker и controller на одних нодах (по умолчанию)
# separated-roles: отдельные пулы для broker и controller
# single-node: одна нода для разработки/тестирования
deploymentMode: dual-role

# JMX Prometheus Exporter для мониторинга
jmx:
  enabled: false  # Включить JMX метрики для Prometheus

# Kafka конфигурация
kafka:
  clusterName: kraft-cluster
  version: "4.0.0"
  metadataVersion: "4.0-IV0"  # Metadata version for KRaft
  
  # Конфигурация репликации (автоматически адаптируется под deploymentMode)
  replication:
    # Для single-node все значения будут = 1
    # Для dual-role и separated-roles используются указанные значения
    offsetsTopicReplicationFactor: 3
    transactionStateLogReplicationFactor: 3
    transactionStateLogMinIsr: 2
    defaultReplicationFactor: 3
    minInsyncReplicas: 2
  
  # Дополнительная Kafka конфигурация
  config:
    auto.create.topics.enable: true
    # Дополнительные параметры можно добавить здесь
  
  # Listeners конфигурация
  listeners:
    enableNodePort: true  # Управление использованием nodePort
    externalnp:
      port: 31090
      tls: false
    externaltls:
      port: 31091
      tls: true
    plain:
      port: 9092
      tls: false
    tls:
      port: 9093
      tls: true

# Конфигурация Node Pools
# Для dual-role и single-node используется nodepool (старая конфигурация - обратная совместимость)
# Для separated-roles используется nodepools (множественные пулы)
nodepool:
  name: dual-role
  roles:
    - broker
    - controller
  replicas: 3
  storage:
    type: persistent-claim
    size: 1Gi
    deleteClaim: false

# Расширенная конфигурация для separated-roles режима
# Если deploymentMode = "separated-roles", используется эта секция
nodepools:
  controller:
    enabled: true
    name: controller
    replicas: 3
    roles:
      - controller
    storage:
      type: persistent-claim  # persistent-claim, ephemeral, jbod
      size: 100Gi
      deleteClaim: false
      # Для JBOD конфигурации:
      # jbodVolumes:
      #   - id: 0
      #     type: persistent-claim
      #     size: 100Gi
      #     deleteClaim: false
      #     kraftMetadata: shared
  
  broker:
    enabled: true
    name: broker
    replicas: 3
    roles:
      - broker
    storage:
      type: persistent-claim
      size: 100Gi
      deleteClaim: false

# EntityOperator конфигурация (для управления Topic и User)
entityOperator:
  enabled: true
  topicOperator:
    enabled: true
  userOperator:
    enabled: true

# Ingress конфигурация
ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: kafka.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kafka-tls-secret
      hosts:
        - kafka.example.com
