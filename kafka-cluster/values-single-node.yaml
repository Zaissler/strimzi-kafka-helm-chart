# Single Node Configuration
# Идеально для локальной разработки и тестирования
# Минимальные требования к ресурсам

namespace: dev

deploymentMode: single-node

kafka:
  clusterName: kafka-single
  version: "4.0.0"
  metadataVersion: "4.0-IV0"
  
  # Репликация автоматически установится в 1 для single-node
  replication:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1
  
  config:
    auto.create.topics.enable: true
  
  listeners:
    enableNodePort: false
    plain:
      port: 9092
      tls: false
    tls:
      port: 9093
      tls: true

nodepool:
  name: dual-role
  roles:
    - broker
    - controller
  replicas: 1
  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: false

entityOperator:
  enabled: true
  topicOperator:
    enabled: true
  userOperator:
    enabled: true

ingress:
  enabled: false
